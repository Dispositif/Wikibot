; Settings for long-running PHP CLI processes (workers/bots), on a
; RAM-constrained VPS (matou, 2 GB, shared with CaseHub).

; Each worker runs in its own container with its own Docker mem_limit;
; this PHP memory_limit is an extra safety net, not the main limit.
memory_limit = 256M

; A CLI process compiles its code once then loops internally (while true):
; opcache mainly speeds up repeated startups, not very useful here, so we
; save the RAM it would otherwise reserve.
opcache.enable_cli = 0

default_charset = "UTF-8"

; Errors are already logged by the application (ConsoleLogger); no need to
; duplicate them on stdout on top of the bot's own echo/print output.
display_errors = Off
log_errors = On
