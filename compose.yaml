services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Values come from the repo-root .env
    # docker compose auto-reads that .env for ${...} substitution here.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wikibot-docker-dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wikibot}
      MYSQL_USER: ${MYSQL_USER:-wikibot_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikibot-docker-dev}

    # Bound to loopback only: local dev DB access, not meant
    # to be reachable from outside this machine.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
      - ./docker/mysql/slow-query.cnf:/etc/mysql/conf.d/slow-query.cnf:ro
      # Directory, not a single file: MySQL creates slow.log itself on
      # first write, and a nonexistent host file path would make Docker
      # bind-mount a root-owned directory in its place instead (same
      # gotcha as google_quota.json — see Makefile). No rotation here yet
      # (unlike Docker's own container log driver, which this bypasses
      # entirely since MySQL writes the file directly) — fine for
      # local/dev, needs logrotate before running unattended on matou.
      - ./docker/mysql/log:/var/log/mysql-slow
      - ./src/Infrastructure/resources/database_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    mem_limit: 300m

    # healthcheck lets the `depends_on: condition: service_healthy` avoid
    # racing a cold container (schema.sql import on first boot takes a few
    # seconds, during which MySQL accepts TCP but rejects queries).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwikibot-docker-dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Google Books link completion (raw books.google URLs -> {ouvrage}).
  # Batch script: processes up to 500 pages then exits, does not loop or
  # depend on MySQL — its own state (daily API quota) lives in a JSON file.
  # The quota file and its .lock (flock() mutex, guards concurrent writers —
  # e.g. a future dockerized ouvrageComplete sharing the same daily quota) are
  # bind-mounted from the host, so the lock is effective across containers/host too.
  # Mount the whole resources/ DIRECTORY, not the individual files: GoogleApiQuota's
  # atomicSave() writes via temp-file-then-rename(), and Linux refuses rename() onto
  # a path that is itself a bind-mount point (EBUSY "Device or resource busy").
  # Mounting the parent directory keeps the rename() target a plain file on a real
  # bind-mounted directory instead.
  goo-extern:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-goo-extern
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/gooExternProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Infrastructure/resources:/app/src/Infrastructure/resources
    mem_limit: 256m

  # Local Tor SOCKS proxy for the external-link crawlers below. Not for
  # Wikipedia itself (login/edits go through the normal API) — only for
  # fetching arbitrary third-party sites, so a single static OVH IP doesn't
  # get flagged/blocked by Cloudflare and similar bot defenses.
  tor:
    build:
      context: .
      dockerfile: docker/tor/Dockerfile
    restart: unless-stopped
    mem_limit: 128m

    # Tor needs time to bootstrap its circuits after boot, and extern-ref/last-extern-ref crash hard (uncaught
    # exception in TorClientAdapter's own startup IP check) if launched too soo after `tor`.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -c '
            exec 3<>/dev/tcp/127.0.0.1/9051 &&
            printf "AUTHENTICATE\r\nGETINFO status/bootstrap-phase\r\nQUIT\r\n" >&3 &&
            grep -q "TAG=done" <&3
          '
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 12

  # External link crawling ({{lien web}} / {{article}} generation from raw
  # URLs) — main/current version, matches the "externref" Makefile target.
  # Supports: --page/--debug/
  # --verbose/--stats/--offset options via `command:` override at run time.
  extern-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-extern-ref
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/externRefProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_externRef_edited.txt:/app/src/Application/resources/article_externRef_edited.txt
    depends_on:
      tor:
        condition: service_healthy
    mem_limit: 256m

  # Bracketed manuscript links ("[url Libellé]") -> {{lien web}}/{{article}}/
  # {{lien brisé}}, blending the crawl with the manuscript's own titre/site/
  # date/auteur/langue. Independent from extern-ref (own dedup file, own
  # CirrusSearch query) while the merge/arbitration logic is being proven out.
  raw-extern-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-raw-extern-ref
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/rawExternLinkProcess.php", "--auto", "--reject-uncertain"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_rawExternRef_edited.txt:/app/src/Application/resources/article_rawExternRef_edited.txt
    depends_on:
      tor:
        condition: service_healthy
    mem_limit: 256m

  # Same external link crawling, but sorted by most-recently-edited pages
  # instead of relevance — a distinct entry point, not a replacement for
  # extern-ref. Shares the same dedup file.
  # The only worker running non-stop : `restart: unless-stopped` relaunches the process
  # as soon as a pass ends, so passes chain by themselves — no cron, no interval to
  # guess, and mutual exclusion for free (one `up` service = one container, Docker
  # refuses a second). That last point is why the cron+flock setup was dropped : flock
  # only guarded the cron invocation, and `make run` (docker compose run) bypassed it
  # entirely, which is how two identical workers ended up running at once.
  # Deploy: make deploy service=last-extern-ref (SIGTERM, finishes its article, exits).
  last-extern-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    container_name: wikibot-last-extern-ref
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/lastExternRefProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_externRef_edited.txt:/app/src/Application/resources/article_externRef_edited.txt
    depends_on:
      tor:
        condition: service_healthy
    mem_limit: 256m
    # Long enough for the article in progress to finish (up to MAX_REFS_PROCESSED_IN_ARTICLE
    # crawls over Tor, plus SLEEP_AFTER_EDITION) before Docker escalates to SIGKILL.
    stop_grace_period: 180s
    # A non-stop worker writes non-stop : uncapped json-file logs fill matou's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Re-crawls the URL of ALREADY-EXISTING {{lien web}}/{{article}} citations --
  # refreshes 'consulté le' + fills gaps on a live page, converts to {{Lien
  # brisé}}/an archived copy when it's gone. Independent from extern-ref/
  # raw-extern-ref for now (own dedup file, own CirrusSearch query) while it's
  # being proven out unsupervised, same posture raw-extern-ref took before it.
  existing-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-existing-ref
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/existingRefProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_existingRef_edited.txt:/app/src/Application/resources/article_existingRef_edited.txt
    depends_on:
      tor:
        condition: service_healthy
    mem_limit: 256m

  # One-off debug tool, not a production worker : replays a single URL (or, with
  # --as-ref, a manuscript "[url Libellé]" fragment) through the same crawl/transform
  # pipeline as extern-ref/last-extern-ref/raw-extern-ref, to see the metadata and the
  # resulting {{lien web}}/{{article}}/{{lien brisé}} without touching Wikipedia.
  # Usage : make run service=test-extern-link args="'http://...'"
  #     or : make run service=test-extern-link args="--as-ref '[http://... Libellé]'"
  test-extern-link:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-test-extern-link
    profiles: ["workers"]
    entrypoint: ["php", "src/Application/CLI/testExternLink.php"]
    env_file:
      - .env
    depends_on:
      tor:
        condition: service_healthy
    mem_limit: 256m

  # Ref-separator syntax fix
  # inserts {{,}} between concatenated <ref>/{{Sfn}} tags and
  # trims stray whitespace before <ref>. Batch script like goo-extern: up to
  # 500 CirrusSearch matches per run, then exits. No loop, no MySQL/Tor
  # dependency, no persistent state — the CirrusSearch query itself only
  # matches the malformed pattern, so already-fixed pages drop out on their own.
  fix-typo:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    container_name: wikibot-fix-typo
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/fixTypo.php"]
    env_file:
      - .env.codexbot2
    mem_limit: 256m

  # ISBN completion pipeline (raw {{Ouvrage}} -> completed, via BnF/Google
  # Books/OpenLibrary/Wikidata). Loops internally (10000 rows per PHP
  # process, sleeps/retries on error) until the MySQL queue is empty
  ouvrage-complete:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/ouvrageCompleteProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Infrastructure/resources:/app/src/Infrastructure/resources
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  # Second half of the ISBN pipeline: takes completed rows from
  # ouvrage-complete's queue and actually edits fr.wikipedia.org.
  ouvrage-edit:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/ouvrageEditProcess.php"]
    env_file:
      - .env.codexbot2
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  # First stage of the ISBN pipeline, upstream of ouvrage-complete: finds
  # {{Ouvrage}} citations on fr.wikipedia.org (CirrusSearch, random draw of up to
  # 5000 matching articles, sieved against page_ouvrages and capped at 500 titles
  # per run — see ouvrageScanProcess.php) and inserts them as raw rows into MySQL
  # for ouvrage-complete/ouvrage-edit to pick up. One-shot batch.
  # Takes an optional page title argument for a manual one-off
  # import instead of the CirrusSearch batch, e.g.:
  #   docker compose run --rm ouvrage-scan php src/Application/CLI/ouvrageScanProcess.php "Some Title"
  ouvrage-scan:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/ouvrageScanProcess.php"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  # Applies src/Infrastructure/resources/migrations/*.sql that aren't in
  # schema_migrations yet (Application/CLI/dbMigrate.php) — needed because
  # database_schema.sql itself only runs once, against an empty MySQL data volume.
  # Run after every `git pull` that adds a migration file: make run service=db-migrate
  db-migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/dbMigrate.php"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 128m

  # Lot 3 : dry-run RC scanner (Application/CLI/recentChangeScanProcess.php) — no
  # signal detection yet, just exercises rc_cursor and reports throughput/memory.
  # Single-shot, run repeatedly (no cron/flock wired up yet): make run service=rc-scan
  rc-scan:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/recentChangeScanProcess.php"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 128m

volumes:
  mysql-data:
