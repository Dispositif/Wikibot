services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wikibot-docker-dev
      MYSQL_DATABASE: wikibot
      MYSQL_USER: wikibot_app
      MYSQL_PASSWORD: wikibot-docker-dev
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
      - ./src/Infrastructure/resources/database_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    mem_limit: 300m

  # Google Books link completion (raw books.google URLs -> {ouvrage}).
  # Batch script: processes up to 500 pages then exits, does not loop or
  # depend on MySQL — its own state (daily API quota) lives in a JSON file.
  # The quota file and its .lock (flock() mutex, guards concurrent writers —
  # e.g. a future dockerized ouvrageComplete sharing the same daily quota) are
  # bind-mounted from the host, so the lock is effective across containers/host too.
  # Mount the whole resources/ DIRECTORY, not the individual files: GoogleApiQuota's
  # atomicSave() writes via temp-file-then-rename(), and Linux refuses rename() onto
  # a path that is itself a bind-mount point (EBUSY "Device or resource busy").
  # Mounting the parent directory keeps the rename() target a plain file on a real
  # bind-mounted directory instead.
  goo-extern:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/gooExternProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Infrastructure/resources:/app/src/Infrastructure/resources
    mem_limit: 256m

  # Local Tor SOCKS proxy for the external-link crawlers below. Not for
  # Wikipedia itself (login/edits go through the normal API) — only for
  # fetching arbitrary third-party sites, so a single static OVH IP doesn't
  # get flagged/blocked by Cloudflare and similar bot defenses.
  tor:
    build:
      context: .
      dockerfile: docker/tor/Dockerfile
    restart: unless-stopped
    mem_limit: 128m

  # External link crawling ({{lien web}} / {{article}} generation from raw
  # URLs) — main/current version, matches the "externref" Makefile target.
  # Supports: --page/--debug/
  # --verbose/--stats/--offset options via `command:` override at run time.
  extern-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/externRefProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_externRef_edited.txt:/app/src/Application/resources/article_externRef_edited.txt
    depends_on:
      - tor
    mem_limit: 256m

  # Same external link crawling, but sorted by most-recently-edited pages
  # instead of relevance — a distinct entry point, not a replacement for
  # extern-ref. Shares the same dedup file.
  last-extern-ref:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    profiles: ["workers"]
    command: ["php", "src/Application/CLI/lastExternRefProcess.php"]
    env_file:
      - .env
    volumes:
      - ./src/Application/resources/article_externRef_edited.txt:/app/src/Application/resources/article_externRef_edited.txt
    depends_on:
      - tor
    mem_limit: 256m

volumes:
  mysql-data:
